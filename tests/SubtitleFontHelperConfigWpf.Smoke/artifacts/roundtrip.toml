wmi_poll_interval = 1200
lru_size = 321
data_path = "%LOCALAPPDATA%/SubtitleFontHelper"
monitor_processes = [
	"mpc-hc64_nvo.exe",
]

[notifications]
managed_index_notifications = true
managed_index_failure_notifications = false
missing_font_notifications = true
missing_font_ignore = [
	"i:.*arial.*",
]

[[notifications.process_missing_font_ignore]]
regex = [
	"Some Missing Font",
	"[A-Z0-9]{8}",
]
processes = [
	"mpc-hc64_nvo.exe",
	"mpc-hc_nvo.exe",
]
flags = "i"

[[index_files]]
path = "indexes/FontIndex.xml"
source_folders = [
	"fonts",
	"%USERPROFILE%/Downloads/fonts",
]
